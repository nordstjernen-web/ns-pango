name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest glib Northstar's CI builds against. ns-pango must keep
          # compiling here: upstream Pango requires glib 2.88, this fork lowers
          # the floor and relies on its own version guards instead.
          - name: ubuntu-24.04 (gcc, oldest supported glib)
            runs-on: ubuntu-24.04
            cc: gcc
          - name: ubuntu-latest (clang)
            runs-on: ubuntu-latest
            cc: clang

    env:
      CC: ${{ matrix.cc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.cc }} pkg-config meson ninja-build \
            libglib2.0-dev libcairo2-dev libharfbuzz-dev libfribidi-dev \
            libfontconfig-dev libfreetype-dev libthai-dev \
            fonts-dejavu-core fonts-noto-cjk

      - name: Report dependency versions
        run: |
          pkg-config --modversion glib-2.0 harfbuzz fribidi cairo fontconfig freetype2 \
            | paste -d' ' - - - - - - \
            | xargs printf 'glib=%s harfbuzz=%s fribidi=%s cairo=%s fontconfig=%s freetype=%s\n'

      # The options Northstar's meson.build passes when it consumes this fork.
      - name: Configure
        run: |
          meson setup builddir \
            -Ddefault_library=static \
            -Dfontconfig=enabled \
            -Dfreetype=enabled \
            -Dintrospection=disabled \
            -Dsysprof=disabled \
            -Dlibthai=auto \
            -Dbuild-testsuite=true \
            --wrap-mode=nofallback

      - name: Build
        run: meson compile -C builddir

      # Northstar links this statically, which hides an unresolved symbol until
      # something pulls the object in. A shared build resolves every reference at
      # link time, so it is the only build that proves the tree is whole.
      - name: Build shared, to catch unresolved symbols
        run: |
          meson setup shareddir \
            -Ddefault_library=shared \
            -Dfontconfig=enabled \
            -Dfreetype=enabled \
            -Dintrospection=disabled \
            -Dsysprof=disabled \
            -Dlibthai=auto \
            --wrap-mode=nofallback
          meson compile -C shareddir

      - name: Check every installed header declares something that exists
        run: |
          # An installed header that declares a function no longer in the tree
          # turns into a link error in whatever calls it, and a static build
          # never reports it because the object is simply never pulled in.
          meson install -C shareddir --destdir /tmp/inst
          nm -g --defined-only shareddir/ns-pango/*.so | \
            awk '$2 ~ /^[TDBRW]$/ { print $3 }' | sort -u > /tmp/defined.txt
          missing=0
          for h in $(find /tmp/inst -name '*.h'); do
            for f in $(grep -hoE '\bns_pango_[a-z0-9_]+[[:space:]]*\(' "$h" | \
                       sed -E 's/[[:space:]]*\($//' | sort -u); do
              grep -qx "$f" /tmp/defined.txt ||
                { echo "$(basename "$h") declares $f, nothing defines it"; missing=1; }
            done
          done
          exit $missing

      - name: Check the symbol prefixes
        run: |
          fail=0
          for a in builddir/ns-pango/libns-pango-1.0.a \
                   builddir/ns-pango/libns-pangocairo-1.0.a \
                   builddir/ns-pango/libns-pangoft2-1.0.a; do
            bare=$(nm -g --defined-only "$a" | grep -cE ' [TDBR] pango_' || true)
            pre=$(nm -g --defined-only "$a" | grep -cE ' [TDBR] ns_pango_' || true)
            echo "$(basename "$a"): unprefixed=$bare prefixed=$pre"
            [ "$bare" -eq 0 ] || fail=1
            [ "$pre" -gt 0 ] || fail=1
          done
          # An unprefixed pango_ symbol would collide with the system Pango that
          # GTK loads into the same process, and GObject aborts when two
          # libraries register one type name.
          exit $fail

      - name: Check the rename script is idempotent
        run: |
          python3 ns-rename.py
          git diff --exit-code

      # The caches must not change a single glyph. tests/ns-text-check dumps
      # every glyph of every run of every line for a corpus that covers the
      # scripts and the wrapping modes the cache's admission rule reasons about,
      # and the three dumps have to be byte for byte identical.
      - name: Check the shape cache against uncached shaping
        run: |
          check=builddir/tests/ns-text-check
          $check dump > /tmp/cached.txt 2> /tmp/cached.log
          NS_PANGO_SHAPE_CACHE=0 $check dump > /tmp/uncached.txt 2> /tmp/uncached.log
          NS_PANGO_SHAPE_CACHE=verify $check dump > /tmp/verified.txt 2> /tmp/verify.log
          NS_PANGO_CACHE_DEBUG=1 $check dump > /dev/null 2> /tmp/skips.log
          cat /tmp/cached.log /tmp/skips.log
          diff -u /tmp/uncached.txt /tmp/cached.txt
          diff -u /tmp/uncached.txt /tmp/verified.txt
          if grep -q 'shape cache mismatch' /tmp/verify.log; then
            echo "verification reported a mismatch" >&2
            exit 1
          fi
          if [ "$(grep -c . /tmp/cached.txt)" -lt 1000 ]; then
            echo "the dump is too short to have measured the corpus" >&2
            exit 1
          fi
          # The cache is pointless if it never serves anything, so a change that
          # quietly stops it caching should fail here rather than just get
          # slower.
          hits=$(sed -n 's/.*hits=\([0-9]*\).*/\1/p' /tmp/cached.log)
          if [ "${hits:-0}" -lt 1000 ]; then
            echo "the cache served only $hits runs" >&2
            exit 1
          fi

      # Northstar shapes off the main thread, and the shape cache is one table
      # for the whole process.
      - name: Check threads agree with a thread on its own
        run: |
          builddir/tests/ns-text-check threads 8
          NS_PANGO_SHAPE_CACHE=0 builddir/tests/ns-text-check threads 8

      # word-spacing has to add space where CSS Text says it does and nowhere
      # else, in every script and both directions.
      - name: Check word-spacing against CSS
        run: builddir/tests/ns-text-check spacing

      # Pango measures with HarfBuzz and draws with cairo, so a synthesised
      # bold or oblique has to reach both of them.
      - name: Check measured advances match drawn advances
        run: builddir/tests/ns-text-check synthesis

      - name: Run the harness under the meson test runner
        run: meson test -C builddir --print-errorlogs
